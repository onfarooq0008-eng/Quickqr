name: Build QuickQR Debug APK

# Runs automatically whenever this file/zip changes, and can also be
# triggered by hand from the Actions tab (no need to push anything).
on:
  push:
    branches: [ main ]
  workflow_dispatch: {}

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      # The Android Studio project lives zipped at the repo root (see README) -
      # this unpacks its contents directly into the repo root (no extra
      # wrapping folder), so app/, build.gradle, settings.gradle etc. end up
      # right here alongside this workflow file.
      - name: Unzip the Android project
        run: unzip -o QuickQR-Android-Studio-Project.zip -d .

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      # No gradlew wrapper jar is included in the project (it's a binary file),
      # so we install the exact Gradle version the project expects directly
      # and call `gradle` instead of `./gradlew`.
      - name: Set up Gradle 8.13
        uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: '8.13'

      - name: Build debug APK
        run: gradle assembleDebug --no-daemon

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: QuickQR-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
